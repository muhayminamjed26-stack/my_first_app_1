name: my_first_app_1
description: نظام إدارة الجامعة - حضور بالباركود وامتحانات وكوزات
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  mobile_scanner: ^5.2.3
  barcode_widget: ^2.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Almarai
      fonts:
        - asset: fonts/Almarai-Regular.ttf
        - asset: fonts/Almarai-Bold.ttf
          weight: 700
        - asset: fonts/Almarai-ExtraBold.ttf
          weight: 800
